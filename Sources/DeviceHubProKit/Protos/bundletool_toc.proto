// The part of bundletool's `toc.pb` that installing a `.apks` set reads: the
// file is a serialized `BuildApksResult` (bundletool's commands.proto and
// targeting.proto, https://github.com/google/bundletool). Messages and field
// numbers match bundletool's; the fields left out here are skipped as
// unknown fields when the file is parsed.

syntax = "proto3";

package android.bundle;

message BuildApksResult {
  repeated Variant variant = 1;
}

// One set of APKs for a range of devices: bundletool writes a variant per
// SDK threshold (uncompressed native libraries from API 23, uncompressed dex
// on later releases, …), and a device installs exactly one of them.
message Variant {
  VariantTargeting targeting = 1;
  repeated ApkSet apk_set = 2;
  uint32 variant_number = 3;
}

message ApkSet {
  ModuleMetadata module_metadata = 1;
  repeated ApkDescription apk_description = 2;
}

message ModuleMetadata {
  string name = 1;
}

message ApkDescription {
  // Relative to the archive root, e.g. `splits/base-master.apk`.
  string path = 2;
  oneof apk_metadata_oneof_value {
    SplitApkMetadata split_apk_metadata = 3;
    StandaloneApkMetadata standalone_apk_metadata = 4;
  }
}

message SplitApkMetadata {
  string split_id = 1;
  bool is_master_split = 2;
}

message StandaloneApkMetadata {
  repeated string fused_module_name = 1;
}

message VariantTargeting {
  SdkVersionTargeting sdk_version_targeting = 1;
  SdkRuntimeTargeting sdk_runtime_targeting = 6;
}

message SdkVersionTargeting {
  repeated SdkVersion value = 1;
}

message SdkVersion {
  // A google.protobuf.Int32Value on the wire.
  Int32Value min = 1;
}

message Int32Value {
  int32 value = 1;
}

message SdkRuntimeTargeting {
  bool requires_sdk_runtime = 1;
}
